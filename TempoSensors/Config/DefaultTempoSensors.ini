[CoreRedirects]
; TempoCamera, TempoLidar, TempoLabels, and TempoSensorsShared collapsed into
; TempoSensors in v2. PackageRedirects let existing user assets resolve the
; UClasses (UTempoCamera, UTempoLidar, UTempoActorLabeler, etc.) that
; previously lived in those modules.
+PackageRedirects=(OldName="/Script/TempoCamera",NewName="/Script/TempoSensors")
+PackageRedirects=(OldName="/Script/TempoLidar",NewName="/Script/TempoSensors")
+PackageRedirects=(OldName="/Script/TempoLabels",NewName="/Script/TempoSensors")
+PackageRedirects=(OldName="/Script/TempoSensorsShared",NewName="/Script/TempoSensors")

; ServeMSTATools plugin folded into TempoSensors (MSTA BEV sensor migration).
; The package redirect resolves the ego BP's baked-in /Script/ServeMSTATools
; class refs (UMstaBevCamera, AMSTARenderBounds, IMSTANotfyInterface); the
; function/class redirects below are carried over unchanged from
; ServeMSTATools' own DefaultServeMSTATools.ini so older renamed
; symbols still resolve.
+PackageRedirects=(OldName="/Script/ServeMSTATools",NewName="/Script/TempoSensors")
+FunctionRedirects=(OldName="/Script/ServeMSTATools.MSTARenderBounds.GetMSTANotifyReceivers",NewName="/Script/ServeMSTATools.MSTARenderBounds.GetMstaNotifyReceivers")
+ClassRedirects=(OldName="/Script/ServeMSTATools.MSTABevOutputComponent",NewName="/Script/ServeMSTATools.MstaBevCamera")
+FunctionRedirects=(OldName="/Script/ServeMSTATools.MstaBevCamera.GetBevOuputMaterialInstance",NewName="/Script/ServeMSTATools.MstaBevCamera.GetBevOutputMaterialInstance")

; Content mount redirect: MSTA content (materials, DataTable, widgets, test map) moved from the
; ServeMSTATools plugin's /ServeMSTATools/ Content mount into this plugin's /TempoSensors/ mount, in the
; same relative subpaths. This lets internal soft/hard object references serialized inside the moved
; .uasset files (e.g. DT_MSTAColorData's row-struct reference) keep resolving.
+PackageRedirects=(OldName="/ServeMSTATools",NewName="/TempoSensors")
